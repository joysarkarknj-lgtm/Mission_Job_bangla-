<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Test</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container">
<section id="startScreen" class="screen active">
<div class="card">
<div class="header"><h1 id="testTitle"></h1></div>
<div class="meta">
<span class="badge">প্রশ্ন: <b id="totalQ"></b></span>
<span class="badge">সময়: <b id="duration"></b> মিনিট</span>
<span class="badge">সঠিক: +<b id="perMark"></b></span>
<span class="badge">ভুল: −<b id="negative"></b></span>
</div>
<label>আপনার নাম</label><input id="name" type="text">
<label>মোবাইল নম্বর</label><input id="mobile" type="tel" maxlength="10">
<button id="startBtn">পরীক্ষা শুরু করুন</button>
</div></section>

<section id="quizScreen" class="screen">
<div class="card">
<div class="header"><b id="progressText"></b><span id="timer" class="timer">40:00</span></div>
<div class="progress"><div id="progressBar"></div></div>
</div>
<div id="questionCard" class="card"></div>
<div class="actions">
<button id="prevBtn" class="secondary">পূর্বের প্রশ্ন</button>
<button id="nextBtn">পরের প্রশ্ন</button>
<button id="submitBtn" class="hidden">পরীক্ষা জমা দিন</button>
</div>
</section>

<section id="resultScreen" class="screen">
<div class="card">
<h2>ফলাফল</h2>
<p id="candidateInfo"></p>
<p>স্কোর: <b id="score"></b></p>
<p>সঠিক: <b id="correct"></b> | ভুল: <b id="wrong"></b> | উত্তরহীন: <b id="unanswered"></b></p>
<p>শতাংশ: <b id="percentage"></b></p>
<button id="reviewBtn">উত্তর পর্যালোচনা</button>
<button id="restartBtn" class="secondary">আবার পরীক্ষা দিন</button>
<div id="review"></div>
</div>
</section>
</div>
<script src="questions.js"></script>
<script src="../engine.js"></script>
</body>
</html>
